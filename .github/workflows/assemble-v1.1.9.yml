name: Assemble v1.1.9 release

on:
  push:
    branches:
      - release-v1.1.9-upload

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, 'release: Pico Uptime v1.1.9') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v1.1.9-upload

      - name: Assemble and verify release
        shell: bash
        run: |
          set -euo pipefail
          cat parts/main.part.* > main.py
          test "$(wc -c < main.py)" -eq 77752
          python -m py_compile main.py
          ! grep -Eq '(_KDE|Canedellebelve2021|NASCOSTO|Chiara|Priverno)' main.py

          rm -rf parts
          rm -f .github/workflows/assemble-v1.1.9.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: Pico Uptime v1.1.9"
          git push origin HEAD:release-v1.1.9-upload
